apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: ecommerce

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: sumeetp111/devops-ecommerce-frontend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          env:
            - name: PRODUCT_SERVICE_URL
              value: http://product-service:8000

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 250m
              memory: 256Mi
